<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anda Sedang Offline — Fundunity</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=open-sans:400,600,700,800|montserrat:700,800,900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --emerald-50: #ecfdf5;
            --emerald-100: #d1fae5;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --emerald-700: #047857;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-700: #334155;
            --slate-900: #0f172a;
        }

        html, body {
            height: 100%;
            font-family: 'Open Sans', sans-serif;
            background: var(--slate-50);
            color: var(--slate-900);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }

        /* Animated background blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }
        .blob-1 {
            width: 400px;
            height: 400px;
            background: var(--emerald-500);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 300px;
            height: 300px;
            background: var(--emerald-600);
            bottom: -80px;
            right: -80px;
            animation-delay: 3s;
        }

        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(20px, 20px) scale(1.05); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: #fff;
            border: 1.5px solid var(--emerald-100);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 24px 64px rgba(0,0,0,0.08), 0 4px 16px rgba(5,150,105,0.08);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon-wrap {
            width: 88px;
            height: 88px;
            background: var(--emerald-50);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(5,150,105,0.2); }
            50% { transform: scale(1.04); box-shadow: 0 0 0 12px rgba(5,150,105,0); }
        }

        .icon-wrap svg {
            width: 44px;
            height: 44px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--slate-900);
            margin-bottom: 12px;
            line-height: 1.2;
        }

        p {
            font-size: 15px;
            color: var(--slate-500);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--emerald-600);
            color: #fff;
            box-shadow: 0 4px 16px rgba(5,150,105,0.25);
        }
        .btn-primary:hover {
            background: var(--emerald-700);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(5,150,105,0.35);
        }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            background: var(--slate-100);
            color: var(--slate-700);
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .status-bar {
            margin-top: 28px;
            padding: 12px 16px;
            background: var(--slate-50);
            border: 1px solid var(--slate-100);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: var(--slate-400);
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .footer-note {
            position: relative;
            z-index: 1;
            margin-top: 24px;
            font-size: 12px;
            color: var(--slate-400);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .card { padding: 36px 24px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <!-- Decorative blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="card">
        <div class="icon-wrap">
            <!-- Wi-Fi Off Icon -->
            <svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M213.92,210.62a8,8,0,1,1-11.84,10.76L170.7,185.8A90.08,90.08,0,0,0,38.06,128a8,8,0,0,1-14.12-7.52A106,106,0,0,1,75.53,71.79L53.17,46.62A8,8,0,1,1,65,35.38l160,176A8,8,0,0,1,213.92,210.62ZM232.06,120.48a8,8,0,0,0-11.28-1.28,92,92,0,0,0-10.89,10.37L189.4,109.83a115.88,115.88,0,0,0-31.81-22.47L95.59,18.69a8,8,0,0,0-11.18,11.4L99.38,46.5A123.93,123.93,0,0,1,232.06,120.48ZM128,176a48,48,0,0,0-33.94,14.06,8,8,0,0,0,11.32,11.32,32,32,0,0,1,45.24,0,8,8,0,0,0,11.32-11.32A48,48,0,0,0,128,176Zm0,48a12,12,0,1,0-12-12A12,12,0,0,0,128,224Z" fill="#059669"/>
            </svg>
        </div>

        <h1>Anda Sedang Offline</h1>
        <p>
            Tidak ada koneksi internet yang terdeteksi. Halaman yang pernah Anda kunjungi sebelumnya masih tersedia dari cache.
        </p>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="window.location.reload()">
                <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor">
                    <path d="M224,48V96a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h28.69L182.06,73.37a80,80,0,1,0,1.68,114,8,8,0,1,1,11,11.64A96,96,0,1,1,195.77,65.73L208,78V48a8,8,0,0,1,16,0Z"/>
                </svg>
                Coba Lagi
            </button>
            <a class="btn btn-secondary" href="/">
                <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor">
                    <path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.44,0,.77.77,0,0,0,.11.11l80,75.48A16,16,0,0,1,224,115.55Z"/>
                </svg>
                Kembali ke Beranda
            </a>
        </div>

        <div class="status-bar">
            <div class="status-dot"></div>
            <span>Status: Tidak terhubung ke internet</span>
        </div>
    </div>

    <p class="footer-note">© Fundunity Foundation</p>

    <script>
        // Auto-reload saat koneksi kembali
        window.addEventListener('online', function() {
            window.location.reload();
        });

        // Cek status koneksi
        if (navigator.onLine) {
            // Jika sebenarnya online, redirect ke halaman sebelumnya atau beranda
            window.location.href = document.referrer || '/';
        }
    </script>
</body>
</html>
